<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Security Verification Test</title>

</head>

<body>

    <h1>Account Verification</h1>

    <p>
        This is a SAFE simulated phishing page for testing
        the Phishing Guard extension.
    </p>


    <!-- Test Form 1 -->

    <form action="http://example.com/login">

        <label>
            Username:
        </label>

        <input
            type="text"
            name="username"
        >

        <br><br>


        <label>
            Password:
        </label>

        <input
            type="password"
            name="password"
        >

        <br><br>

        <button type="submit">
            Verify Account
        </button>

    </form>


    <br>


    <!-- Test Form 2 -->

    <form action="http://example.com/verify">

        <input
            type="text"
            placeholder="Verification code"
        >

        <button type="submit">
            Continue
        </button>

    </form>


    <br>


    <!-- Test links -->

    <a href="http://example.com/login">
        Login
    </a>

    <br><br>

    <a href="http://example.com/account">
        Account Verification
    </a>


    <br><br>


    <!-- Test iframe -->

    <iframe
        src="https://example.com"
        width="200"
        height="100">
    </iframe>


    <p>
        ⚠️ TEST PAGE ONLY — DO NOT ENTER REAL INFORMATION.
    </p>

</body>

</html>
